name: Test

on: [push]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      # Clone repo and install python
      - name: Check out repository
        uses: actions/checkout@v7
      # Setup Python and uv
      - name: Install uv and Python version ${{ matrix.python-version }}
        id: setup-python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Install the Project and Dependencies
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      # Run lints
      - name: Run lints
        run: |
          uv run ruff check pub_analyzer tests
          uv run ty check pub_analyzer tests
      # Run Formatter
      - name: Run format
        run: |
          uv run ruff format --check pub_analyzer tests
      # Run test suite
      - name: Run tests
        run: |
          uv run pytest --block-network
