[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "detect-private-key" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "ruff-format",
        name = "ruff-format",
        language = "system",
        entry = "make format",
        types = ["python"],
        pass_filenames = false,
    },
    {
        id = "ruff-lint",
        name = "ruff-lint",
        language = "system",
        entry = "make lint",
        types = ["python"],
        pass_filenames = false,
    },
    {
        id = "ty",
        name = "ty",
        language = "system",
        entry = "make typecheck",
        types = ["python"],
        pass_filenames = false,
    },
]
