[project]
name = "pub-analyzer"
version = "0.5.7"
description = "A text user interface, written in python, which automates the generation of scientific production reports using OpenAlex"
readme = "README.md"
license = "MIT"

requires-python = ">=3.11,<4.0"

authors = [{ name = "Alejandro Gaspar", email = "alejandro@gaspar.land" }]
maintainers = [{ name = "Alejandro Gaspar", email = "alejandro@gaspar.land" }]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "textual==8.2.8",
    "httpx2[http2]==2.14.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.16.2",
    "typst==0.13.2",
]

[project.urls]
Homepage = "https://github.com/alejandrgaspar/pub-analyzer"
Repository = "https://github.com/alejandrgaspar/pub-analyzer"
Documentation = "https://pub-analyzer.com/"

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project.scripts]
pub-analyzer = "pub_analyzer.main:run"

[dependency-groups]
dev = [
    "textual-dev==1.8.0",
    "prek==0.4.3",
    "ty==0.0.65",
    "ruff==0.15.18",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "vcrpy==8.5.0",
    "pytest-recording==0.13.4",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
]

[project.optional-dependencies]

docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
    "mkdocstrings[python]==1.0.4",
    "mkdocstrings-python==2.0.5",
]

[tool.uv.build-backend]
module-name = "pub_analyzer"
module-root = ""

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.coverage.run]
source = ["pub_analyzer"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.mypy]
strict = true

[tool.ruff]
required-version = ">=0.3.4"
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "D", # pydocstyle
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "INP", # flake8-no-pep420
    "RUF", # Ruff-specific rules
    "T20", # flake8-print
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]

ignore = [
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D402", # First line should not be the function's signature
    "D413", # Missing blank line after last section ("{name}")
    "D415", # First line should end with a period, question mark, or exclamation point
    "D416", # Section name should end with a colon ("{name}")
    "D417", # Missing argument description in the docstring: {name}
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
